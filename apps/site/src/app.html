<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="application-name" content="Tensum" />
		<meta name="apple-mobile-web-app-title" content="Tensum" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#2e2e33" media="(prefers-color-scheme: dark)" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="shortcut icon" href="%sveltekit.assets%/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<script>
			try {
				document.documentElement.classList.toggle(
					'dark',
					localStorage.getItem('theme') !== 'light'
				);
			} catch {
				// Keep the default dark theme when storage is unavailable.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
