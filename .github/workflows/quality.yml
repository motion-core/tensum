name: Quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  release-check:
    name: Release check (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter tensum exec playwright install --with-deps chromium

      - name: Run the local release gate
        run: pnpm release:check

      - name: Pack the runtime artifact
        run: |
          mkdir -p .artifacts
          pnpm --filter tensum pack --pack-destination .artifacts

      - name: Upload the runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: tensum-package
          path: .artifacts/*.tgz
          if-no-files-found: error
          include-hidden-files: true

  runtime-support:
    name: Runtime smoke (Node ${{ matrix.node }})
    needs: release-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - "20.19.0"
          - "22"
          - "24"

    steps:
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Download the packed package
        uses: actions/download-artifact@v4
        with:
          name: tensum-package
          path: .artifacts

      - name: Install the package as a production dependency
        run: |
          mkdir -p runtime-consumer
          cd runtime-consumer
          npm init --yes
          npm install --ignore-scripts --no-audit --no-fund ../.artifacts/*.tgz gsap@3.15.0

      - name: Import every ESM entry point
        working-directory: runtime-consumer
        run: |
          node --input-type=module --eval "const root = await import('tensum'); const css = await import('tensum/css'); const coupled = await import('tensum/coupled'); if (typeof root.registerSpringPlugin !== 'function' || typeof css.springToCSSLinear !== 'function' || typeof coupled.createCoupledSpringSystem !== 'function') process.exit(1);"

      - name: Verify the CommonJS contract
        working-directory: runtime-consumer
        run: |
          node --eval "for (const id of ['tensum', 'tensum/css', 'tensum/coupled']) { try { require(id); process.exit(1); } catch (error) { if (error.code !== 'ERR_PACKAGE_PATH_NOT_EXPORTED') throw error; } }"
